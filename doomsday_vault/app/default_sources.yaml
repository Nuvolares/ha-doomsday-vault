# Built-in catalog shipped with Doomsday Vault.
#
# type: kiwix -> a ZIM archive from https://download.kiwix.org/zim/<folder>/
#                "book" is the file name without the trailing _YYYY-MM.zim;
#                the newest dated release is picked automatically.
# type: url   -> any direct file link (PDF, TXT, HTML, ZIM, ...).
#
# size_hint is informational (approximate size of the latest release).
sources:
  # --- Encyclopedia & Reference -------------------------------------------
  - id: wikipedia
    name: Wikipedia (complete, with images)
    category: Encyclopedia & Reference
    type: kiwix
    folder: wikipedia
    book: wikipedia_en_all_maxi
    size_hint: 119G
    enabled: true
    description: All of English Wikipedia, every article with images.
  - id: wiktionary
    name: Wiktionary
    category: Encyclopedia & Reference
    type: kiwix
    folder: wiktionary
    book: wiktionary_en_all_nopic
    size_hint: 8G
    enabled: true
    description: Dictionary and thesaurus for English words.
  - id: wikivoyage
    name: Wikivoyage
    category: Encyclopedia & Reference
    type: kiwix
    folder: wikivoyage
    book: wikivoyage_en_all_maxi
    size_hint: 1G
    enabled: true
    description: Travel guides for regions, cities and routes.
  - id: wikibooks
    name: Wikibooks
    category: Encyclopedia & Reference
    type: kiwix
    folder: wikibooks
    book: wikibooks_en_all_maxi
    size_hint: 5G
    enabled: true
    description: Open textbooks and how-to manuals on hundreds of subjects.
  - id: wikiversity
    name: Wikiversity
    category: Encyclopedia & Reference
    type: kiwix
    folder: wikiversity
    book: wikiversity_en_all_maxi
    size_hint: 2G
    enabled: false
    description: Free learning materials and courses.

